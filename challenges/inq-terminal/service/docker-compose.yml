# The port is read from .env, which Ansible writes. Never edit this file to
# change the port.
services:
  terminal:
    build: ./terminal
    image: terminal:latest
    container_name: terminal
    restart: unless-stopped
    ports:
      - "${TERMINAL_PORT:-9423}:9423"
    # No volume: the terminal keeps slips in memory. A restart starts clean, so
    # avoid needless restarts during a game. The service is written not to crash
    # (a corrupted free-list link is validated, never followed), so an attacker
    # cannot force a restart.
    environment:
      - TERMINAL_PORT=9423
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9423; printf 'HELLO\\n' >&3; head -1 <&3 | grep -q terminal"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s
    mem_limit: 256m
    pids_limit: 64

